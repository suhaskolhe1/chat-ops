<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Ops</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Auth View -->
        <div id="auth-view" class="panel">
            <div class="auth-header">
                <h2>CHAT_OPS</h2>
                <p>System Login</p>
            </div>
            <form id="auth-form">
                <div class="input-group">
                    <label for="username">USER_ID</label>
                    <input type="text" id="username" placeholder="e.g. root" required autocomplete="off" />
                </div>
                <div class="input-group">
                    <label for="room">WORKSPACE</label>
                    <input type="text" id="room" placeholder="e.g. main" value="main" required autocomplete="off" />
                </div>
                <button type="submit" class="btn primary-btn">CONNECT</button>
                <div id="auth-error" class="error-msg"></div>
            </form>
        </div>

        <!-- Chat View -->
        <div id="chat-room" class="panel hidden">
            <div class="chat-header">
                <div class="header-left">
                    <h2>CHAT_OPS</h2>
                    <span class="divider">|</span>
                    <span class="room-badge">#<span id="current-room"></span></span>
                </div>
                <div class="header-right">
                    <span class="user-badge">@<span id="current-user"></span></span>
                    <button id="leave-btn" class="btn" title="Leave">EXIT</button>
                </div>
            </div>
            
            <div id="messages-container">
                <div id="load-more-btn" class="load-more hidden">[ LOAD_HISTORY ]</div>
                <div id="messages"></div>
            </div>
            
            <div id="typing-indicator"></div>

            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <span class="prompt">></span>
                    <input type="text" id="msg-input" placeholder="..." autocomplete="off" />
                    <button id="send-btn" class="btn primary-btn">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
